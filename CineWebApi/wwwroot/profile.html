<!doctype html>
<html lang="es">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Mi Perfil | Cine TP</title>
    <link rel="stylesheet" href="./css/adminlte.css" />
    <link rel="stylesheet" href="/css/cine.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
</head>
<body class="layout-fixed sidebar-expand-lg sidebar-collapse bg-body-tertiary">
    <div class="app-wrapper">
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" aria-label="Toggle sidebar">
                            <i class="bi bi-list"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./index.html" class="nav-link">
                            <i class="bi bi-film me-1" aria-hidden="true"></i>
                            <span>Cartelera</span>
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item d-flex align-items-center gap-2">
                        <a href="./auth/login.html" class="btn btn-outline-primary btn-sm">Iniciar sesión</a>
                    </li>
                </ul>
            </div>
        </nav>

        <main class="app-main">
            <div class="app-content-header">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-6">
                            <h1 class="mb-0 fs-3">Mi Perfil</h1>
                        </div>
                        <div class="col-sm-6">
                            <ol class="breadcrumb float-sm-end">
                                <li class="breadcrumb-item"><a href="./index.html">Inicio</a></li>
                                <li class="breadcrumb-item active" aria-current="page">Mi Perfil</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>

            <div class="app-content">
                <div class="container-fluid">
                    <div id="estado-perfil" class="alert alert-info d-none" role="alert"></div>

                    <div class="card" id="card-perfil">
                        <div class="card-header">
                            <h2 class="card-title mb-0 fs-5">Datos del cliente</h2>
                        </div>
                        <div class="card-body">
                            <dl class="row mb-0">
                                <dt class="col-sm-4">Nombre y Apellido</dt>
                                <dd class="col-sm-8" id="perfil-nombre-completo">-</dd>

                                <dt class="col-sm-4">DNI</dt>
                                <dd class="col-sm-8" id="perfil-dni">-</dd>

                                <dt class="col-sm-4">Email</dt>
                                <dd class="col-sm-8" id="perfil-email">-</dd>

                                <dt class="col-sm-4">Teléfono</dt>
                                <dd class="col-sm-8" id="perfil-telefono">-</dd>

                                <dt class="col-sm-4">Fecha de nacimiento</dt>
                                <dd class="col-sm-8" id="perfil-fecha-nac">-</dd>

                                <dt class="col-sm-4">Tipo de público</dt>
                                <dd class="col-sm-8" id="perfil-tipo-publico">-</dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <strong>Cine TP</strong>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
    <script src="./js/adminlte.js"></script>
    <script>
                // @ts-nocheck
                (async () => {
                    const alerta = document.getElementById('estado-perfil');

                    function mostrarAlerta(tipo, texto) {
                        if (!alerta) return;
                        alerta.className = 'alert alert-' + String(tipo);
                        alerta.textContent = String(texto);
                        alerta.classList.remove('d-none');
                    }

                    const token =
                        localStorage.getItem('token') ||
                        localStorage.getItem('jwt') ||
                        sessionStorage.getItem('token') ||
                        sessionStorage.getItem('jwt');

                    if (!token) {
                        mostrarAlerta('warning', 'No se encontró un token de sesión. Iniciá sesión primero para ver tu perfil.');
                        return;
                    }

                    mostrarAlerta('info', 'Cargando datos de tu perfil...');

                    try {
                        const resp = await fetch('/api/clientes/me', {
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Accept': 'application/json'
                            }
                        });

                        if (!resp.ok) {
                            mostrarAlerta('danger', `No se pudo obtener el perfil (código ${resp.status}).`);
                            return;
                        }

                        const data = await resp.json();
                        if (alerta) {
                            alerta.classList.add('d-none');
                        }

                        const elNombre = document.getElementById('perfil-nombre-completo');
                        const elDni = document.getElementById('perfil-dni');
                        const elEmail = document.getElementById('perfil-email');
                        const elTelefono = document.getElementById('perfil-telefono');
                        const elFechaNac = document.getElementById('perfil-fecha-nac');
                        const elTipoPublico = document.getElementById('perfil-tipo-publico');

                        if (elNombre) {
                            elNombre.textContent =
                                `${data.nombre ?? data.Nombre ?? ''} ${data.apellido ?? data.Apellido ?? ''}`.trim() || '-';
                        }
                        if (elDni) {
                            elDni.textContent = data.dni ?? data.Dni ?? '-';
                        }
                        if (elEmail) {
                            elEmail.textContent = data.email ?? data.Email ?? '-';
                        }
                        if (elTelefono) {
                            elTelefono.textContent = data.telefono ?? data.Telefono ?? 'No informado';
                        }

                        const fechaRaw = data.fechaNacimiento ?? data.FechaNacimiento;
                        if (elFechaNac && fechaRaw) {
                            const fecha = new Date(fechaRaw);
                            elFechaNac.textContent =
                                Number.isNaN(fecha.getTime()) ? String(fechaRaw) : fecha.toLocaleDateString('es-AR');
                        }

                        const tipoPublico = data.idTipoPublico ?? data.IdTipoPublico;
                        if (elTipoPublico) {
                            elTipoPublico.textContent =
                                tipoPublico !== null && tipoPublico !== undefined ? `ID ${tipoPublico}` : '-';
                        }
                    } catch {
                        mostrarAlerta('danger', 'Error de conexión al consultar /api/clientes/me.');
                    }
                })();
    </script>
</body>
</html>
