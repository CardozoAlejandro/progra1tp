<!doctype html>
<html lang="es">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>AdminLTE 4 | Register Page</title>

    <script>
              (() => {
                'use strict';
                const root = document.documentElement;

                if (root.getAttribute('data-lte-color-mode') === 'off') {
                  return;
                }

                const STORAGE_KEY = 'lte-theme';
                let stored = null;
                try {
                  stored = localStorage.getItem(STORAGE_KEY);
                } catch {
                  // localStorage may be unavailable.
                }

                const authored = root.getAttribute('data-bs-theme');
                let resolved = 'light';
                if (stored === 'dark' || stored === 'light') {
                  resolved = stored;
                } else if (authored === 'dark' || authored === 'light') {
                  resolved = authored;
                } else if (globalThis.matchMedia('(prefers-color-scheme: dark)').matches) {
                  resolved = 'dark';
                }
                root.setAttribute('data-bs-theme', resolved);
                root.style.colorScheme = resolved;
                if (resolved !== authored) {
                  root.setAttribute('data-lte-theme-resolved', '');
                }
              })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#007bff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
    <meta name="title" content="AdminLTE 4 | Register Page" />
    <meta name="author" content="ColorlibHQ" />
    <meta name="supported-color-schemes" content="light dark" />
    <link rel="preload" href="../css/adminlte.css" as="style" />

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.3.0/index.css"
          integrity="sha256-5UwXtC6TaPHCAbVQ59waEAqOssHyhn/twyuLRRWszzo="
          crossorigin="anonymous"
          media="print"
          onload="this.media = 'all'" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.16.0/styles/overlayscrollbars.min.css"
          crossorigin="anonymous" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          crossorigin="anonymous" />
    <link rel="stylesheet" href="../css/adminlte.css" />
</head>

<body class="register-page bg-body-secondary">
    <main class="register-box">
        <h1 class="register-logo">
            <a href="../index.html"><b>Admin</b>LTE</a>
        </h1>

        <div class="card">
            <div class="card-body register-card-body">
                <p class="register-box-msg">Registrar un nuevo usuario</p>

                <div id="registro-alerta" class="alert d-none" role="alert"></div>

                <form id="registerForm" novalidate>
                    <label class="visually-hidden" for="registerUser">Nombre de usuario</label>
                    <div class="input-group mb-3">
                        <input id="registerUser"
                               name="NombreUsuario"
                               type="text"
                               class="form-control"
                               placeholder="Nombre de usuario"
                               autocomplete="username"
                               required />
                        <div class="input-group-text">
                            <span class="bi bi-person"></span>
                        </div>
                    </div>

                    <label class="visually-hidden" for="registerEmail">Email</label>
                    <div class="input-group mb-3">
                        <input id="registerEmail"
                               name="Email"
                               type="email"
                               class="form-control"
                               placeholder="Email"
                               required />
                        <div class="input-group-text">
                            <span class="bi bi-envelope"></span>
                        </div>
                    </div>

                    <label class="visually-hidden" for="registerPassword">Password</label>
                    <div class="input-group mb-3">
                        <input id="registerPassword"
                               name="Password"
                               type="password"
                               class="form-control"
                               placeholder="Password"
                               required />
                        <div class="input-group-text">
                            <span class="bi bi-lock-fill"></span>
                        </div>
                    </div>

                    <label class="visually-hidden" for="registerNombre">Nombre</label>
                    <div class="input-group mb-3">
                        <input id="registerNombre"
                               name="Nombre"
                               type="text"
                               class="form-control"
                               placeholder="Nombre"
                               autocomplete="given-name"
                               required />
                    </div>

                    <label class="visually-hidden" for="registerApellido">Apellido</label>
                    <div class="input-group mb-3">
                        <input id="registerApellido"
                               name="Apellido"
                               type="text"
                               class="form-control"
                               placeholder="Apellido"
                               autocomplete="family-name"
                               required />
                    </div>

                    <label class="visually-hidden" for="registerDni">DNI</label>
                    <div class="input-group mb-3">
                        <input id="registerDni"
                               name="Dni"
                               type="text"
                               inputmode="numeric"
                               class="form-control"
                               placeholder="DNI (sin puntos)"
                               required />
                        <div class="input-group-text">
                            <span class="bi bi-person-vcard"></span>
                        </div>
                    </div>

                    <label for="registerNacimiento" class="form-label small mb-1">Fecha de nacimiento</label>
                    <div class="input-group mb-3">
                        <input id="registerNacimiento"
                               name="FechaNacimiento"
                               type="date"
                               class="form-control"
                               required />
                        <div class="input-group-text">
                            <span class="bi bi-calendar-event"></span>
                        </div>
                    </div>

                    <label class="visually-hidden" for="registerTelefono">Teléfono (opcional)</label>
                    <div class="input-group mb-3">
                        <input id="registerTelefono"
                               name="Telefono"
                               type="tel"
                               class="form-control"
                               placeholder="Teléfono (opcional)"
                               autocomplete="tel" />
                        <div class="input-group-text">
                            <span class="bi bi-telephone"></span>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mb-3">
                        <button id="btnRegistrar" type="submit" class="btn btn-primary">Registrar</button>
                    </div>
                </form>

                <p class="mb-0">
                    <a href="login.html" class="text-center">Ya tengo una cuenta</a>
                </p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.16.0/browser/overlayscrollbars.browser.es6.min.js"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
            crossorigin="anonymous"></script>
    <script src="../js/adminlte.js"></script>
    <script>
              const SELECTOR_SIDEBAR_WRAPPER = '.sidebar-wrapper';
              const Default = {
                scrollbarTheme: 'os-theme-light',
                scrollbarAutoHide: 'leave',
                scrollbarClickScroll: true,
              };
              document.addEventListener('DOMContentLoaded', function () {
                const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);
                const isMobile = window.innerWidth <= 992;

                if (
                  sidebarWrapper &&
                  globalThis.OverlayScrollbarsGlobal?.OverlayScrollbars !== undefined &&
                  !isMobile
                ) {
                  OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
                    scrollbars: {
                      theme: Default.scrollbarTheme,
                      autoHide: Default.scrollbarAutoHide,
                      clickScroll: Default.scrollbarClickScroll,
                    },
                  });
                }
              });
    </script>

    <script>
              // @ts-nocheck
              (() => {
                const form = document.getElementById('registerForm');
                const alerta = document.getElementById('registro-alerta');
                const btnRegistrar = document.getElementById('btnRegistrar');

                function mostrarAlerta(tipo, mensaje) {
                  if (!alerta) return;
                  alerta.className = 'alert alert-' + String(tipo);
                  alerta.textContent = String(mensaje);
                  alerta.classList.remove('d-none');
                }

                if (!form) return;

                form.addEventListener('submit', async (event) => {
                  event.preventDefault();

                  const fd = new FormData(form);
                  const getVal = (key) => {
                    const v = fd.get(key);
                    return typeof v === 'string' ? v : '';
                  };

                  const fechaNacimiento = getVal('FechaNacimiento');
                  const telefonoRaw = getVal('Telefono').trim();

                  const payload = {
                    NombreUsuario: getVal('NombreUsuario').trim(),
                    Email: getVal('Email').trim(),
                    Password: getVal('Password'),
                    Nombre: getVal('Nombre').trim(),
                    Apellido: getVal('Apellido').trim(),
                    Dni: getVal('Dni').trim(),
                    FechaNacimiento: fechaNacimiento || null,
                    Telefono: telefonoRaw || null
                  };

                  if (btnRegistrar) {
                    btnRegistrar.setAttribute('disabled', 'disabled');
                  }
                  mostrarAlerta('info', 'Registrando usuario...');

                  try {
                    const resp = await fetch('/api/auth/register', {
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                      },
                      body: JSON.stringify(payload)
                    });

                    let data = null;
                    try {
                      data = await resp.json();
                    } catch {
                      data = null;
                    }

                    if (resp.ok) {
                      mostrarAlerta('success', (data && data.mensaje) || 'Usuario creado correctamente. Redirigiendo al login...');
                      setTimeout(() => {
                        window.location.href = 'login.html';
                      }, 900);
                      return;
                    }

                    const errorMsg =
                      (data && (data.mensaje || data.message)) ||
                      (data && data.errors ? JSON.stringify(data.errors) : null) ||
                      `Error al registrar (código ${resp.status}).`;
                    mostrarAlerta('danger', errorMsg);
                  } catch {
                    mostrarAlerta('danger', 'No se pudo conectar con /api/auth/register.');
                  } finally {
                    if (btnRegistrar) {
                      btnRegistrar.removeAttribute('disabled');
                    }
                  }
                });
              })();
    </script>
</body>
</html>
