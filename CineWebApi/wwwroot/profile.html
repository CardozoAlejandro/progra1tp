<!doctype html>
<html lang="es">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Mi Perfil | Cine TP</title>
    <link rel="stylesheet" href="./css/adminlte.css" />
    <link rel="stylesheet" href="/css/cine.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
</head>
<body class="layout-fixed sidebar-expand-lg sidebar-collapse bg-body-tertiary">
    <div class="app-wrapper">
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" aria-label="Toggle sidebar">
                            <i class="bi bi-list"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./index.html" class="nav-link">
                            <i class="bi bi-film me-1" aria-hidden="true"></i>
                            <span>Cartelera</span>
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item d-flex align-items-center gap-2">
                        <a id="btnLoginPerfil" href="./auth/login.html" class="btn btn-outline-primary btn-sm">Iniciar sesión</a>
                    </li>
                </ul>
            </div>
        </nav>

        <main class="app-main">
            <div class="app-content-header">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-6">
                            <h1 class="mb-0 fs-3">Mi Perfil</h1>
                        </div>
                        <div class="col-sm-6">
                            <ol class="breadcrumb float-sm-end">
                                <li class="breadcrumb-item"><a href="./index.html">Inicio</a></li>
                                <li class="breadcrumb-item active" aria-current="page">Mi Perfil</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>

            <div class="app-content">
                <div class="container-fluid">
                    <div id="estado-perfil" class="alert alert-info d-none" role="alert"></div>

                    <div class="card" id="card-perfil">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h2 class="card-title mb-0 fs-5">Datos del cliente</h2>
                        </div>
                        <div class="card-body">
                            <!-- Vista de lectura -->
                            <div id="vista-lectura">
                                <dl class="row mb-0">
                                    <dt class="col-sm-4">Nombre y Apellido</dt>
                                    <dd class="col-sm-8" id="perfil-nombre-completo">-</dd>

                                    <dt class="col-sm-4">DNI</dt>
                                    <dd class="col-sm-8" id="perfil-dni">-</dd>

                                    <dt class="col-sm-4">Email</dt>
                                    <dd class="col-sm-8" id="perfil-email">-</dd>

                                    <dt class="col-sm-4">Teléfono</dt>
                                    <dd class="col-sm-8" id="perfil-telefono">-</dd>

                                    <dt class="col-sm-4">Fecha de nacimiento</dt>
                                    <dd class="col-sm-8" id="perfil-fecha-nac">-</dd>

                                    <dt class="col-sm-4">Tipo de público</dt>
                                    <dd class="col-sm-8" id="perfil-tipo-publico">-</dd>
                                </dl>
                            </div>

                            <!-- Vista de edición de datos -->
                            <form id="form-editar-perfil" class="d-none" novalidate>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="edit-nombre" class="form-label">Nombre</label>
                                        <input type="text" id="edit-nombre" class="form-control" required />
                                    </div>
                                    <div class="col-md-6">
                                        <label for="edit-apellido" class="form-label">Apellido</label>
                                        <input type="text" id="edit-apellido" class="form-control" required />
                                    </div>
                                    <div class="col-md-6">
                                        <label for="edit-email" class="form-label">Email</label>
                                        <input type="email" id="edit-email" class="form-control" required />
                                    </div>
                                    <div class="col-md-6">
                                        <label for="edit-telefono" class="form-label">Teléfono</label>
                                        <input type="text" id="edit-telefono" class="form-control" />
                                    </div>
                                    <div class="col-md-4">
                                        <label for="edit-dni" class="form-label">DNI (no editable)</label>
                                        <input type="text" id="edit-dni" class="form-control" disabled readonly />
                                    </div>
                                    <div class="col-md-4">
                                        <label for="edit-fecha-nac" class="form-label">Fecha de nacimiento (no editable)</label>
                                        <input type="text" id="edit-fecha-nac" class="form-control" disabled readonly />
                                    </div>
                                    <div class="col-md-4">
                                        <label for="edit-tipo-publico" class="form-label">Tipo de público (no editable)</label>
                                        <input type="text" id="edit-tipo-publico" class="form-control" disabled readonly />
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 mt-4">
                                    <button type="button" id="btnCancelarEdicion" class="btn btn-secondary btn-sm">
                                        <i class="bi bi-x-circle me-1" aria-hidden="true"></i>
                                        <span>Cancelar</span>
                                    </button>
                                    <button type="submit" id="btnGuardarPerfil" class="btn btn-primary btn-sm">
                                        <i class="bi bi-check-circle me-1" aria-hidden="true"></i>
                                        <span>Guardar cambios</span>
                                    </button>
                                </div>
                            </form>

                            <!-- Vista de cambio de contraseña -->
                            <form id="form-cambiar-password" class="d-none" novalidate>
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label for="pass-actual" class="form-label">Contraseña actual</label>
                                        <input type="password" id="pass-actual" class="form-control" required autocomplete="current-password" />
                                    </div>
                                    <div class="col-md-4">
                                        <label for="pass-nueva" class="form-label">Nueva contraseña</label>
                                        <input type="password" id="pass-nueva" class="form-control" required autocomplete="new-password" />
                                    </div>
                                    <div class="col-md-4">
                                        <label for="pass-confirmar" class="form-label">Confirmar nueva contraseña</label>
                                        <input type="password" id="pass-confirmar" class="form-control" required autocomplete="new-password" />
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 mt-4">
                                    <button type="button" id="btnCancelarPassword" class="btn btn-secondary btn-sm">
                                        <i class="bi bi-x-circle me-1" aria-hidden="true"></i>
                                        <span>Cancelar</span>
                                    </button>
                                    <button type="submit" id="btnGuardarPassword" class="btn btn-warning btn-sm">
                                        <i class="bi bi-key me-1" aria-hidden="true"></i>
                                        <span>Actualizar contraseña</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                        <div id="acciones-perfil" class="card-footer d-flex flex-wrap justify-content-end gap-2 d-none">
                            <button type="button" id="btnEditarPerfil" class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-pencil-square me-1" aria-hidden="true"></i>
                                <span>Actualizar datos</span>
                            </button>
                            <button type="button" id="btnAbrirPassword" class="btn btn-outline-warning btn-sm">
                                <i class="bi bi-key me-1" aria-hidden="true"></i>
                                <span>Cambiar contraseña</span>
                            </button>
                            <button type="button" id="btnCerrarSesion" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-box-arrow-right me-1" aria-hidden="true"></i>
                                <span>Cerrar sesión</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <strong>Cine TP</strong>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
    <script src="./js/adminlte.js"></script>
    <script>
                // @ts-nocheck
                (async () => {
                    const alerta = document.getElementById('estado-perfil');
                    const btnLoginHeader = document.getElementById('btnLoginPerfil');
                    const accionesPerfil = document.getElementById('acciones-perfil');
                    const btnEditarPerfil = document.getElementById('btnEditarPerfil');
                    const btnCancelarEdicion = document.getElementById('btnCancelarEdicion');
                    const btnGuardarPerfil = document.getElementById('btnGuardarPerfil');
                    const btnAbrirPassword = document.getElementById('btnAbrirPassword');
                    const btnCancelarPassword = document.getElementById('btnCancelarPassword');
                    const btnGuardarPassword = document.getElementById('btnGuardarPassword');
                    const btnCerrarSesion = document.getElementById('btnCerrarSesion');
                    const vistaLectura = document.getElementById('vista-lectura');
                    const formEditar = document.getElementById('form-editar-perfil');
                    const formPassword = document.getElementById('form-cambiar-password');

                    let perfilActual = null;

                    function mostrarAlerta(tipo, texto) {
                        if (!alerta) return;
                        alerta.className = 'alert alert-' + String(tipo);
                        alerta.textContent = String(texto);
                        alerta.classList.remove('d-none');
                    }

                    function ocultarAlerta() {
                        if (!alerta) return;
                        alerta.classList.add('d-none');
                    }

                    function cerrarSesion() {
                        localStorage.removeItem('token');
                        localStorage.removeItem('jwt');
                        sessionStorage.removeItem('token');
                        sessionStorage.removeItem('jwt');
                        window.location.href = './index.html';
                    }

                    function obtenerToken() {
                        const rawToken =
                            localStorage.getItem('token') ||
                            localStorage.getItem('jwt') ||
                            sessionStorage.getItem('token') ||
                            sessionStorage.getItem('jwt');
                        return rawToken ? rawToken.replace(/^Bearer\s+/i, '').trim() : '';
                    }

                    function formatearFecha(fechaRaw) {
                        if (!fechaRaw) return '-';
                        const fecha = new Date(fechaRaw);
                        return Number.isNaN(fecha.getTime()) ? String(fechaRaw) : fecha.toLocaleDateString('es-AR');
                    }

                    function renderizarPerfil(data) {
                        perfilActual = data;

                        const nombre = data.nombre ?? data.Nombre ?? '';
                        const apellido = data.apellido ?? data.Apellido ?? '';
                        const dni = data.dni ?? data.Dni ?? '-';
                        const email = data.email ?? data.Email ?? '-';
                        const telefono = data.telefono ?? data.Telefono ?? '';
                        const fechaRaw = data.fechaNacimiento ?? data.FechaNacimiento;
                        const tipoPublico = data.idTipoPublico ?? data.IdTipoPublico;

                        const elNombre = document.getElementById('perfil-nombre-completo');
                        const elDni = document.getElementById('perfil-dni');
                        const elEmail = document.getElementById('perfil-email');
                        const elTelefono = document.getElementById('perfil-telefono');
                        const elFechaNac = document.getElementById('perfil-fecha-nac');
                        const elTipoPublico = document.getElementById('perfil-tipo-publico');

                        if (elNombre) elNombre.textContent = `${nombre} ${apellido}`.trim() || '-';
                        if (elDni) elDni.textContent = dni;
                        if (elEmail) elEmail.textContent = email;
                        if (elTelefono) elTelefono.textContent = telefono || 'No informado';
                        if (elFechaNac) elFechaNac.textContent = formatearFecha(fechaRaw);
                        if (elTipoPublico) {
                            elTipoPublico.textContent =
                                tipoPublico !== null && tipoPublico !== undefined ? `ID ${tipoPublico}` : '-';
                        }

                        // Precargar campos del formulario de edición
                        const editNombre = document.getElementById('edit-nombre');
                        const editApellido = document.getElementById('edit-apellido');
                        const editEmail = document.getElementById('edit-email');
                        const editTelefono = document.getElementById('edit-telefono');
                        const editDni = document.getElementById('edit-dni');
                        const editFechaNac = document.getElementById('edit-fecha-nac');
                        const editTipoPublico = document.getElementById('edit-tipo-publico');

                        if (editNombre) editNombre.value = nombre;
                        if (editApellido) editApellido.value = apellido;
                        if (editEmail) editEmail.value = email === '-' ? '' : email;
                        if (editTelefono) editTelefono.value = telefono;
                        if (editDni) editDni.value = dni;
                        if (editFechaNac) editFechaNac.value = formatearFecha(fechaRaw);
                        if (editTipoPublico) {
                            editTipoPublico.value =
                                tipoPublico !== null && tipoPublico !== undefined ? `ID ${tipoPublico}` : '-';
                        }
                    }

                    function mostrarVista(vista) {
                        vistaLectura?.classList.toggle('d-none', vista !== 'lectura');
                        formEditar?.classList.toggle('d-none', vista !== 'editar');
                        formPassword?.classList.toggle('d-none', vista !== 'password');

                        btnEditarPerfil?.classList.toggle('d-none', vista !== 'lectura');
                        btnAbrirPassword?.classList.toggle('d-none', vista !== 'lectura');

                        if (vista === 'lectura' && perfilActual) {
                            renderizarPerfil(perfilActual);
                        }
                        if (vista === 'password') {
                            formPassword?.reset();
                        }
                    }

                    if (btnCerrarSesion) {
                        btnCerrarSesion.addEventListener('click', cerrarSesion);
                    }

                    if (btnEditarPerfil) {
                        btnEditarPerfil.addEventListener('click', () => {
                            ocultarAlerta();
                            mostrarVista('editar');
                        });
                    }

                    if (btnCancelarEdicion) {
                        btnCancelarEdicion.addEventListener('click', () => {
                            ocultarAlerta();
                            mostrarVista('lectura');
                        });
                    }

                    if (btnAbrirPassword) {
                        btnAbrirPassword.addEventListener('click', () => {
                            ocultarAlerta();
                            mostrarVista('password');
                        });
                    }

                    if (btnCancelarPassword) {
                        btnCancelarPassword.addEventListener('click', () => {
                            ocultarAlerta();
                            mostrarVista('lectura');
                        });
                    }

                    const token = obtenerToken();
                    const haySesion = Boolean(token && token !== 'null' && token !== 'undefined');

                    if (haySesion) {
                        btnLoginHeader?.classList.add('d-none');
                        accionesPerfil?.classList.remove('d-none');
                    } else {
                        btnLoginHeader?.classList.remove('d-none');
                        accionesPerfil?.classList.add('d-none');
                        mostrarAlerta('warning', 'No se encontró un token de sesión. Iniciá sesión primero para ver tu perfil.');
                        return;
                    }

                    mostrarAlerta('info', 'Cargando datos de tu perfil...');

                    try {
                        const resp = await fetch('/api/clientes/me', {
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Accept': 'application/json'
                            }
                        });

                        if (!resp.ok) {
                            mostrarAlerta('danger', `No se pudo obtener el perfil (código ${resp.status}).`);
                            return;
                        }

                        const data = await resp.json();
                        ocultarAlerta();
                        renderizarPerfil(data);
                    } catch {
                        mostrarAlerta('danger', 'Error de conexión al consultar /api/clientes/me.');
                    }

                    if (formEditar) {
                        formEditar.addEventListener('submit', async (e) => {
                            e.preventDefault();
                            const tokenActual = obtenerToken();
                            if (!tokenActual) {
                                mostrarAlerta('warning', 'Tu sesión expiró. Iniciá sesión nuevamente.');
                                return;
                            }

                            const nombre = document.getElementById('edit-nombre')?.value.trim() ?? '';
                            const apellido = document.getElementById('edit-apellido')?.value.trim() ?? '';
                            const email = document.getElementById('edit-email')?.value.trim() ?? '';
                            const telefono = document.getElementById('edit-telefono')?.value.trim() ?? '';

                            if (!nombre || !apellido || !email) {
                                mostrarAlerta('warning', 'Nombre, apellido y email son obligatorios.');
                                return;
                            }

                            if (btnGuardarPerfil) btnGuardarPerfil.disabled = true;
                            mostrarAlerta('info', 'Guardando cambios en tu perfil...');

                            try {
                                const payload = {
                                    nombre,
                                    apellido,
                                    email,
                                    telefono: telefono || null
                                };

                                const resp = await fetch('/api/clientes/me', {
                                    method: 'PUT',
                                    headers: {
                                        'Authorization': `Bearer ${tokenActual}`,
                                        'Content-Type': 'application/json',
                                        'Accept': 'application/json'
                                    },
                                    body: JSON.stringify(payload)
                                });

                                if (!resp.ok) {
                                    const errText = await resp.text().catch(() => '');
                                    mostrarAlerta(
                                        'danger',
                                        `No se pudieron guardar los cambios (código ${resp.status})${errText ? `: ${errText}` : '.'}`
                                    );
                                    return;
                                }

                                const respPerfil = await fetch('/api/clientes/me', {
                                    headers: {
                                        'Authorization': `Bearer ${tokenActual}`,
                                        'Accept': 'application/json'
                                    }
                                });

                                if (respPerfil.ok) {
                                    const actualizado = await respPerfil.json();
                                    renderizarPerfil(actualizado);
                                } else {
                                    renderizarPerfil({
                                        ...(perfilActual || {}),
                                        nombre,
                                        apellido,
                                        email,
                                        telefono
                                    });
                                }

                                mostrarVista('lectura');
                                mostrarAlerta('success', 'Tus datos se actualizaron correctamente.');
                            } catch {
                                mostrarAlerta('danger', 'Error de conexión al intentar guardar los cambios.');
                            } finally {
                                if (btnGuardarPerfil) btnGuardarPerfil.disabled = false;
                            }
                        });
                    }

                    if (formPassword) {
                        formPassword.addEventListener('submit', async (e) => {
                            e.preventDefault();
                            const tokenActual = obtenerToken();
                            if (!tokenActual) {
                                mostrarAlerta('warning', 'Tu sesión expiró. Iniciá sesión nuevamente.');
                                return;
                            }

                            const passwordActual = document.getElementById('pass-actual')?.value ?? '';
                            const passwordNueva = document.getElementById('pass-nueva')?.value ?? '';
                            const passwordConfirmar = document.getElementById('pass-confirmar')?.value ?? '';

                            if (!passwordActual || !passwordNueva || !passwordConfirmar) {
                                mostrarAlerta('warning', 'Completá la contraseña actual, la nueva contraseña y su confirmación.');
                                return;
                            }

                            if (passwordNueva === passwordActual) {
                                mostrarAlerta('warning', 'La nueva contraseña no puede ser igual a la contraseña actual.');
                                return;
                            }

                            if (passwordNueva.length < 6) {
                                mostrarAlerta('warning', 'La nueva contraseña debe tener al menos 6 caracteres.');
                                return;
                            }

                            if (passwordNueva !== passwordConfirmar) {
                                mostrarAlerta('warning', 'La nueva contraseña y su confirmación no coinciden.');
                                return;
                            }

                            if (btnGuardarPassword) btnGuardarPassword.disabled = true;
                            mostrarAlerta('info', 'Actualizando contraseña...');

                            try {
                                const resp = await fetch('/api/clientes/me/password', {
                                    method: 'PUT',
                                    headers: {
                                        'Authorization': `Bearer ${tokenActual}`,
                                        'Content-Type': 'application/json',
                                        'Accept': 'application/json'
                                    },
                                    body: JSON.stringify({
                                        passwordActual,
                                        passwordNueva
                                    })
                                });

                                if (!resp.ok) {
                                    const errText = await resp.text().catch(() => '');
                                    mostrarAlerta(
                                        'danger',
                                        `No se pudo cambiar la contraseña (código ${resp.status})${errText ? `: ${errText}` : '.'}`
                                    );
                                    return;
                                }

                                mostrarVista('lectura');
                                mostrarAlerta('success', 'Contraseña actualizada correctamente.');
                            } catch {
                                mostrarAlerta('danger', 'Error de conexión al intentar cambiar la contraseña.');
                            } finally {
                                if (btnGuardarPassword) btnGuardarPassword.disabled = false;
                            }
                        });
                    }
                })();
    </script>
</body>
</html>
