<!doctype html>
<html lang="es">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>AdminLTE 4 | Login Page</title>

    <script>
              (() => {
                'use strict';
                const root = document.documentElement;

                if (root.getAttribute('data-lte-color-mode') === 'off') {
                  return;
                }

                const STORAGE_KEY = 'lte-theme';
                let stored = null;
                try {
                  stored = localStorage.getItem(STORAGE_KEY);
                } catch {
                  // localStorage may be unavailable.
                }

                const authored = root.getAttribute('data-bs-theme');
                let resolved = 'light';
                if (stored === 'dark' || stored === 'light') {
                  resolved = stored;
                } else if (authored === 'dark' || authored === 'light') {
                  resolved = authored;
                } else if (globalThis.matchMedia('(prefers-color-scheme: dark)').matches) {
                  resolved = 'dark';
                }
                root.setAttribute('data-bs-theme', resolved);
                root.style.colorScheme = resolved;
                if (resolved !== authored) {
                  root.setAttribute('data-lte-theme-resolved', '');
                }
              })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#007bff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
    <meta name="title" content="AdminLTE 4 | Login Page" />
    <meta name="author" content="ColorlibHQ" />
    <meta name="supported-color-schemes" content="light dark" />
    <link rel="preload" href="../css/adminlte.css" as="style" />

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.3.0/index.css"
          integrity="sha256-5UwXtC6TaPHCAbVQ59waEAqOssHyhn/twyuLRRWszzo="
          crossorigin="anonymous"
          media="print"
          onload="function () { this.media = 'all'; }" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.16.0/styles/overlayscrollbars.min.css"
          crossorigin="anonymous" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          crossorigin="anonymous" />
    <link rel="stylesheet" href="../css/adminlte.css" />
</head>

<body class="login-page bg-body-secondary">
    <main class="login-box">
        <h1 class="login-logo">
            <a href="../index.html"><b>Admin</b>LTE</a>
        </h1>

        <div class="card">
            <div class="card-body login-card-body">
                <p class="login-box-msg">Inicia sesión para continuar</p>

                <div id="login-alerta" class="alert d-none" role="alert"></div>

                <form id="loginForm" novalidate>
                    <label class="visually-hidden" for="loginUser">Nombre de usuario</label>
                    <div class="input-group mb-3">
                        <input id="loginUser"
                               name="NombreUsuario"
                               type="text"
                               class="form-control"
                               placeholder="Nombre de usuario"
                               autocomplete="username"
                               required />
                        <div class="input-group-text">
                            <span class="bi bi-person"></span>
                        </div>
                    </div>

                    <label class="visually-hidden" for="loginPassword">Contraseña</label>
                    <div class="input-group mb-3">
                        <input id="loginPassword"
                               name="Password"
                               type="password"
                               class="form-control"
                               placeholder="Password"
                               autocomplete="current-password"
                               required />
                        <div class="input-group-text">
                            <span class="bi bi-lock-fill"></span>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mb-3">
                        <button id="btnLogin" type="submit" class="btn btn-primary">Iniciar Sesión</button>
                    </div>
                </form>

                <p class="mb-1">
                    <a href="forgot-password.html">Olvidé mi contraseña</a>
                </p>
                <p class="mb-0">
                    <a href="register.html" class="text-center">Registrar una nueva cuenta</a>
                </p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.16.0/browser/overlayscrollbars.browser.es6.min.js"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
            crossorigin="anonymous"></script>
    <script src="../js/adminlte.js"></script>
    <script>
              (() => {
                const selectorSidebarWrapper = '.sidebar-wrapper';
                const configScrollbars = {
                  scrollbarTheme: 'os-theme-light',
                  scrollbarAutoHide: 'leave',
                  scrollbarClickScroll: true,
                };
                document.addEventListener('DOMContentLoaded', () => {
                  const sidebarWrapper = document.querySelector(selectorSidebarWrapper);
                  const isMobile = window.innerWidth <= 992;
                  /** @type {any} */
                  const g = globalThis;
                  const osGlobal = g.OverlayScrollbarsGlobal;

                  if (sidebarWrapper && osGlobal && typeof osGlobal.OverlayScrollbars === 'function' && !isMobile) {
                    osGlobal.OverlayScrollbars(sidebarWrapper, {
                      scrollbars: {
                        theme: configScrollbars.scrollbarTheme,
                        autoHide: configScrollbars.scrollbarAutoHide,
                        clickScroll: configScrollbars.scrollbarClickScroll,
                      },
                    });
                  }
                });
              })();
    </script>

    <script>
              (() => {
                /** @type {HTMLFormElement | null} */
                const form = /** @type {HTMLFormElement | null} */ (document.getElementById('loginForm'));
                const alerta = document.getElementById('login-alerta');
                const btnLogin = document.getElementById('btnLogin');

                /**
                 * @param {string} tipo
                 * @param {string} mensaje
                 */
                function mostrarAlerta(tipo, mensaje) {
                  if (!alerta) return;
                  alerta.className = 'alert alert-' + String(tipo);
                  alerta.textContent = String(mensaje);
                  alerta.classList.remove('d-none');
                }

                /**
                 * @param {any} data
                 */
                function extraerToken(data) {
                  if (!data || typeof data !== 'object') return null;
                  return (
                    data.token ||
                    data.Token ||
                    data.jwt ||
                    data.Jwt ||
                    data.accessToken ||
                    (data.data && (data.data.token || data.data.Token)) ||
                    null
                  );
                }

                if (!form) return;

                form.addEventListener('submit', async (event) => {
                  event.preventDefault();

                  const fd = new FormData(form);
                  /** @param {string} key */
                  const getVal = (key) => {
                    const v = fd.get(key);
                    return typeof v === 'string' ? v : '';
                  };

                  const usuarioOrEmail = getVal('NombreUsuario').trim();
                  const password = getVal('Password');

                  const payload = {
                    NombreUsuario: usuarioOrEmail,
                    Email: usuarioOrEmail,
                    Password: password
                  };

                  if (btnLogin) {
                    btnLogin.setAttribute('disabled', 'disabled');
                  }
                  mostrarAlerta('info', 'Iniciando sesión...');

                  try {
                    const resp = await fetch('/api/auth/login', {
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                      },
                      body: JSON.stringify(payload)
                    });

                    /** @type {any} */
                    let data = null;
                    try {
                      data = await resp.json();
                    } catch {
                      data = null;
                    }

                    if (!resp.ok) {
                      const errorMsg =
                        (data && (data.mensaje || data.message || data.title)) ||
                        `Credenciales inválidas o error al iniciar sesión (código ${resp.status}).`;
                      mostrarAlerta('danger', errorMsg);
                      return;
                    }

                    const token = extraerToken(data);
                    if (!token) {
                      mostrarAlerta('warning', 'Inicio de sesión exitoso, pero no se recibió un token en la respuesta.');
                      return;
                    }

                    localStorage.setItem('token', String(token));
                    localStorage.setItem('jwt', String(token));

                    mostrarAlerta('success', '¡Sesión iniciada! Abriendo tu perfil...');
                    setTimeout(() => {
                      window.location.href = '../profile.html';
                    }, 600);
                  } catch {
                    mostrarAlerta('danger', 'No se pudo conectar con /api/auth/login.');
                  } finally {
                    if (btnLogin) {
                      btnLogin.removeAttribute('disabled');
                    }
                  }
                });
              })();
    </script>
</body>
</html>
